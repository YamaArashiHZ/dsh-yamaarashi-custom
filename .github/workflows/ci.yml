name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck (shell + components)
        run: |
          npm run typecheck
          npm run typecheck:balance

      - name: Build (shell + components)
        run: |
          npm run build
          npm run build:balance

      - name: Test (jsdom + host checks)
        run: npm test

      - name: Pack dry-run (all three packages)
        run: |
          npm pack --dry-run
          npm run pack:bundle -- --dry-run --ignore-scripts
          npm run pack:balance -- --dry-run --ignore-scripts
